name: Update venues from Airtable

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch: {} # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-venues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest venues from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/fetch-airtable-venues.js

      - name: Commit updated venues.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add venues.json
          if git diff --cached --quiet; then
            echo "No venue changes this week."
            exit 0
          fi
          git commit -m "Update venues.json from Airtable [automated]"
          git push
